<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>Pure KVM Pro - Perfect Final</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 10px; background-color: #0f111a; color: #ffffff; display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }
    
    #lockScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f111a; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    .login-card { background: #1a1c29; padding: 30px; border-radius: 14px; border: 1px solid #2a2d42; width: 100%; max-width: 350px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
    .login-card h2 { color: #00d2ff; margin-bottom: 20px; font-size: 22px; }
    #passInput { font-size: 16px; text-align: center; padding: 12px; width: 100%; border-radius: 8px; border: 2px solid #333852; background: #12141f; color: white; margin-bottom: 15px; outline: none; }
    #passInput:focus { border-color: #00d2ff; }
    #loginBtn { padding: 12px; width: 100%; font-size: 16px; font-weight: bold; background: #0078d4; border: none; border-radius: 8px; color: white; cursor: pointer; }
    #loginError { color: #ff4757; margin-top: 12px; font-size: 13px; font-weight: bold; display: none; }
    
    #topBar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; padding: 6px 10px; background: #161925; border-radius: 8px; border: 1px solid #25283d; }
    .status-group { display: flex; align-items: center; gap: 8px; }
    #netStatus { font-size: 11px; font-weight: bold; background: #222638; padding: 4px 8px; border-radius: 4px; color: #00d2ff; }
    #refreshBtn { font-size: 11px; font-weight: bold; background: #25283d; color: #fff; padding: 4px 8px; border-radius: 4px; border: none; cursor: pointer; }
    
    #trackpad { height: 150px; min-height: 150px; background-color: #161925; border-radius: 10px; margin-bottom: 8px; touch-action: none; border: 2px dashed #00d2ff; display: flex; align-items: center; justify-content: center; color: #8a92b2; font-size: 14px; font-weight: 600; outline: none; cursor: crosshair; text-align: center; padding: 0 10px; }
    
    .row { display: flex; gap: 8px; margin-bottom: 8px; width: 100%; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; margin-bottom: 8px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; margin-bottom: 8px; }
    
    .btn { padding: 12px 6px; font-size: 13px; font-weight: bold; cursor: pointer; border: none; border-radius: 8px; background-color: #222638; color: white; transition: 0.1s; display: flex; align-items: center; justify-content: center; user-select: none; }
    .btn:active, .btn.clicked { background-color: #383d59; transform: scale(0.96); }
    
    .btn-left { border-bottom: 3px solid #ff4757; }
    .btn-right { border-bottom: 3px solid #2ed573; }
    .btn-drag { border-bottom: 3px solid #feca57; background-color: #2a2e43; }
    .btn-drag.active { background-color: #feca57; color: black; }
    .btn-scroll { background-color: #0096c7; border-bottom: 3px solid #00b4d8; }
    
    .key-btn { padding: 12px 6px; font-size: 13px; background-color: #222638; border: none; border-radius: 8px; color: white; font-weight: bold; transition: 0.1s; cursor: pointer; user-select: none; text-align: center; }
    .key-btn:active, .key-btn.clicked { background-color: #00d2ff; color: black; transform: scale(0.95); }
    
    .analog-pad { display: grid; grid-template-areas: ". a-up ." "a-left a-down a-right"; gap: 8px; width: 100%; margin-bottom: 8px; background: #161925; padding: 8px; border-radius: 10px; border: 1px dashed #333852; }
    .a-up { grid-area: a-up; background-color: #e67e22; } 
    .a-down { grid-area: a-down; background-color: #e67e22; } 
    .a-left { grid-area: a-left; background-color: #e67e22; } 
    .a-right { grid-area: a-right; background-color: #e67e22; }
    .analog-title { text-align: center; font-size: 11px; color: #8a92b2; margin-bottom: 4px; grid-column: span 3; font-weight: bold; }

    .d-pad { display: grid; grid-template-areas: ". up ." "left down right"; gap: 8px; flex: 1; }
    .up { grid-area: up; } .down { grid-area: down; } .left { grid-area: left; } .right { grid-area: right; }
    
    #textInput { flex: 1; height: 45px; min-height: 45px; padding: 8px; font-size: 14px; font-weight: bold; border-radius: 8px; border: 2px solid #00d2ff; outline: none; background-color: #12141f; color: #00d2ff; resize: none; }
    #textInput::placeholder { color: #555870; font-size: 12px; }
    
    #appContent { display: none; flex-direction: column; height: 100%; overflow-y: auto; padding-bottom: 20px; }
    #hiddenKeyCatcher { position: absolute; top: -9999px; left: -9999px; opacity: 0; width: 1px; height: 1px; }
  </style>
</head>
<body>

  <!-- Login Overlay -->
  <div id="lockScreen">
    <div class="login-card">
      <h2>🔐 Secure KVM</h2>
      <input type="password" id="passInput" placeholder="Enter Password" onkeypress="if(event.key === 'Enter') verifyPassword()">
      <button id="loginBtn" onclick="verifyPassword()">Login</button>
      <div id="loginError">❌ Wrong Password!</div>
    </div>
  </div>

  <!-- Main Interface -->
  <div id="appContent">
    <input type="text" id="hiddenKeyCatcher" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">

    <div id="topBar">
      <div style="font-size: 14px; font-weight: bold; color: #00d2ff;">⚡ Pure KVM Pro - Perfect Final</div>
      <div class="status-group">
        <button id="refreshBtn" onclick="location.reload()">🔄 Refresh</button>
        <div id="netStatus">🟢 Ready</div>
      </div>
    </div>

    <!-- Trackpad area -->
    <div id="trackpad" tabindex="0">👉 Click here to Lock Control 👈</div>
    
    <!-- Mouse Clicks & Drag -->
    <div class="grid-3">
      <button class="btn btn-left" onclick="sendCmd('click', 'L')">Left Click</button>
      <button id="dragBtn" class="btn btn-drag" onclick="toggleDrag()">Drag: OFF</button>
      <button class="btn btn-right" onclick="sendCmd('click', 'R')">Right Click</button>
    </div>

    <!-- Analog Mouse Movement Pad (سرعة طبيعية وسلسة) -->
    <div class="analog-pad">
      <div class="analog-title">Mouse Analog Movement Pad</div>
      <button class="key-btn a-up" onpointerdown="sendCmd('joy', '0,-5')" onpointerup="sendCmd('joy', '0,0')" onpointerleave="sendCmd('joy', '0,0')">M-UP ⬆️</button>
      <button class="key-btn a-left" onpointerdown="sendCmd('joy', '-5,0')" onpointerup="sendCmd('joy', '0,0')" onpointerleave="sendCmd('joy', '0,0')">M-LFT ⬅️</button>
      <button class="key-btn a-down" onpointerdown="sendCmd('joy', '0,5')" onpointerup="sendCmd('joy', '0,0')" onpointerleave="sendCmd('joy', '0,0')">M-DN ⬇️</button>
      <button class="key-btn a-right" onpointerdown="sendCmd('joy', '5,0')" onpointerup="sendCmd('joy', '0,0')" onpointerleave="sendCmd('joy', '0,0')">M-RGT ➡️</button>
    </div>

    <!-- Scroll Buttons -->
    <div class="row">
      <button class="btn btn-scroll" style="flex:1;" onclick="sendCmd('scroll', '3')">Scroll ⬆️</button>
      <button class="btn btn-scroll" style="flex:1;" onclick="sendCmd('scroll', '-3')">Scroll ⬇️</button>
    </div>

    <!-- Text Typing Area -->
    <div class="row">
      <textarea id="textInput" placeholder="Type here for direct live streaming..."></textarea>
      <button class="btn" style="background:#0078d4; width:80px; font-weight:bold;" onclick="sendTextDirect()">Send</button>
    </div>

    <!-- Clipboard & Special Actions -->
    <div class="grid-4">
      <button class="key-btn" style="background:#0984e3;" onclick="sendMacro([128, 99])">Copy 📋</button>
      <button class="key-btn" style="background:#00b894;" onclick="sendMacro([128, 118])">Paste 📝</button>
      <button class="key-btn" style="background:#e17055;" onclick="sendMacro([128, 122])">Undo ↩️</button>
      <button class="key-btn" style="background:#d63031;" onclick="sendCmd('cad', '1')">CAD</button>
    </div>

    <!-- Functional Keys Grid -->
    <div class="grid-4">
      <button class="key-btn" style="background:#8e44ad" onclick="sendCmd('lang', '1')">Lang 🌐</button>
      <button class="key-btn" style="background:#e1b12c; color:black;" onclick="sendCmd('key', '193')">Caps</button>
      <button class="key-btn" onclick="sendCmd('altf4', '1')">Alt+F4</button>
      <button class="key-btn" onclick="sendCmd('key', '177')">ESC</button>
    </div>

    <div class="grid-4">
      <button class="key-btn" onclick="sendCmd('key', '212')">DEL</button>
      <button class="key-btn" onclick="sendCmd('key', '178')">Backspace</button>
      <button class="key-btn" onclick="sendCmd('key', '198')">F5</button>
      <button class="key-btn" style="background:#28a745" onclick="sendCmd('key', '176')">Enter</button>
    </div>

    <!-- Clear All & D-Pad Arrows -->
    <div class="row">
      <button class="key-btn key-clr" style="flex: 0.5; background:#c0392b;" onclick="releaseAll()">CLR</button>
      <div class="d-pad">
        <button class="key-btn up" onclick="sendCmd('key', '218')">UP</button>
        <button class="key-btn left" onclick="sendCmd('key', '216')">LT</button>
        <button class="key-btn down" onclick="sendCmd('key', '217')">DN</button>
        <button class="key-btn right" onclick="sendCmd('key', '215')">RT</button>
      </div>
    </div>
  </div>

  <script>
    const NGROK_BASE = "https://sharply-snarl-buckle.ngrok-free.dev";
    const LOCAL_BASE = "http://192.168.1.7:8080";
    let ACTIVE_URL = NGROK_BASE;
    let userPassword = localStorage.getItem("kvm_password") || "";

    function detectNetwork() {
      const controller = new AbortController();
      setTimeout(() => controller.abort(), 800);
      fetch(LOCAL_BASE + "/ping", { signal: controller.signal })
        .then(res => { if (res.ok) { ACTIVE_URL = LOCAL_BASE; document.getElementById('netStatus').innerHTML = "🟢 Local"; checkSavedLogin(); } })
        .catch(err => { ACTIVE_URL = NGROK_BASE; document.getElementById('netStatus').innerHTML = "🔵 Remote"; checkSavedLogin(); });
    }

    function checkSavedLogin() { if (userPassword !== "") verifyPassword(true); }

    function verifyPassword(isAuto = false) {
      let pwd = isAuto ? userPassword : document.getElementById('passInput').value;
      let errorDiv = document.getElementById('loginError');
      if (pwd === "") return;
      fetch(ACTIVE_URL + "/login", { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pwd }) })
      .then(res => {
        if (res.status === 200) {
          userPassword = pwd; localStorage.setItem("kvm_password", pwd);
          document.getElementById('lockScreen').style.display = "none";
          document.getElementById('appContent').style.display = "flex";
        } else {
          localStorage.removeItem("kvm_password");
          if(!isAuto) errorDiv.style.display = "block";
        }
      }).catch(err => { if(!isAuto) errorDiv.style.display = "block"; });
    }
    window.onload = detectNetwork;

    function sendCmd(type, val) {
      fetch(ACTIVE_URL + "/set_command", {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
        body: JSON.stringify({ type: type, val: val })
      }).catch(err => console.log(err));
    }

    function sendMacro(keysArray) {
      sendCmd('combo', keysArray.join(','));
    }

    let isDragging = false;
    function toggleDrag() {
      isDragging = !isDragging;
      let btn = document.getElementById('dragBtn');
      btn.innerText = isDragging ? "Drag: ON" : "Drag: OFF";
      btn.classList.toggle('active', isDragging);
      sendCmd('drag', isDragging ? "1" : "-1"); 
    }

    function releaseAll() {
      isDragging = false;
      document.getElementById('dragBtn').innerText = "Drag: OFF";
      document.querySelectorAll('.active').forEach(b => b.classList.remove('active'));
      sendCmd('release', '1');
    }

    function sendTextDirect() {
      let ti = document.getElementById('textInput');
      if(ti.value !== "") { 
        sendCmd('text', ti.value); 
        ti.value = ''; 
      }
    }

    // Trackpad & Mouse Engine (الماوس باد طبيعي تماماً بدون مضاعفات، والماوس الخارجي نشط وسريع عند الـ Active فقط)
    let trackpad = document.getElementById('trackpad'), hiddenCatcher = document.getElementById('hiddenKeyCatcher');
    let isPointerLocked = false, moveTimeout = null, accDx = 0, accDy = 0, lastX = 0, lastY = 0;

    trackpad.addEventListener('touchstart', (e) => { lastX = e.touches[0].clientX; lastY = e.touches[0].clientY; });
    trackpad.addEventListener('touchmove', (e) => {
      accDx += Math.round(e.touches[0].clientX - lastX); // سرعة طبيعية 1:1
      accDy += Math.round(e.touches[0].clientY - lastY); // سرعة طبيعية 1:1
      lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
      processMouseMovement();
      e.preventDefault();
    }, { passive: false });

    trackpad.addEventListener('click', () => {
      hiddenCatcher.focus();
      if(trackpad.requestPointerLock) trackpad.requestPointerLock();
    });

    document.addEventListener('pointerlockchange', () => {
      isPointerLocked = (document.pointerLockElement === trackpad);
      if (isPointerLocked) {
        document.getElementById('netStatus').innerHTML = "🔒 Active";
        trackpad.innerHTML = "🔥 Control Locked - Type Now!";
        hiddenCatcher.focus();
      } else {
        document.getElementById('netStatus').innerHTML = "🟢 Ready";
        trackpad.innerHTML = "👉 Click here to Lock Control 👈";
        hiddenCatcher.blur();
      }
    });

    // الماوس الخارجي لما يتعمل Active (تضخيم السرعة والـ DPI هنا فقط لتعويض الوايرلس)
    document.addEventListener('mousemove', (e) => {
      if (!isPointerLocked) return;
      accDx += Math.round(e.movementX * 2.5); // تعويض DPI الماوس الوايرلس حصراً عند القفل
      accDy += Math.round(e.movementY * 2.5); 
      processMouseMovement();
    });

    function processMouseMovement() {
      if (!moveTimeout) {
        moveTimeout = setTimeout(() => {
          let sx = Math.round(accDx), sy = Math.round(accDy);
          if (sx !== 0 || sy !== 0) { 
            sendCmd('move', `${sx},${sy}`); 
            accDx = 0; 
            accDy = 0; 
          }
          moveTimeout = null;
        }, 12); 
      }
    }

    document.addEventListener('mousedown', (e) => { 
      if (isPointerLocked) { 
        if(e.button === 0) sendCmd('drag', '1');      
        else if(e.button === 1) sendCmd('click', 'M');  
        else if(e.button === 2) sendCmd('click', 'R');  
      } 
    });
    
    document.addEventListener('mouseup', (e) => { if (isPointerLocked && e.button===0) sendCmd('drag','-1'); });
    document.addEventListener('wheel', (e) => { if(isPointerLocked) { if(e.deltaY>0)sendCmd('scroll','-3'); else sendCmd('scroll','3'); } }, {passive:true});
    document.addEventListener('contextmenu', e => { if(isPointerLocked) e.preventDefault(); });

    // ==========================================
    // 🧠 Final Keyboard Engine (Win Key Fixed, Shift+Enter, Zero, etc.)
    // ==========================================
    hiddenCatcher.addEventListener('keydown', (e) => {
      if (isPointerLocked) {
        e.preventDefault(); 
        e.stopPropagation();
        
        if (e.key === "Escape") { 
          document.exitPointerLock(); 
          sendCmd('key', '177'); 
          return; 
        }

        // 1. زرار الويندوز (Win Key Fixed)
        if (e.code === 'MetaLeft' || e.code === 'MetaRight' || e.key === 'Meta' || e.key === 'OS') {
          sendCmd('win', '1');
          hiddenCatcher.value = '';
          return;
        }

        // 2. اختصار Shift + Enter لكسر السطر
        if (e.shiftKey && e.code === 'Enter') {
          sendCmd('combo', '129,176'); 
          hiddenCatcher.value = '';
          return;
        }

        // 3. الاختصارات المركبة (Ctrl, Alt, Shift, Win + زرار أو أسهم)
        if (e.ctrlKey || e.altKey || e.metaKey || e.shiftKey) {
          let keys = [];
          if (e.ctrlKey) keys.push(128);
          if (e.shiftKey) keys.push(129); 
          if (e.altKey) keys.push(130);
          if (e.metaKey) keys.push(131);

          if (e.code === 'Tab') {
            keys.push(179);
            sendCmd('combo', keys.join(','));
            hiddenCatcher.value = '';
            return;
          }

          let arrowCode = getArrowCode(e.code);
          if (arrowCode > 0) {
            keys.push(arrowCode);
            sendCmd('combo', keys.join(','));
            hiddenCatcher.value = '';
            return;
          }

          let keyChar = e.key.toLowerCase();
          if (keyChar.length === 1 && keyChar !== 'control' && keyChar !== 'alt' && keyChar !== 'shift' && keyChar !== 'meta') {
            if (keyChar === '0') {
              keys.push(48);
            } else {
              keys.push(keyChar.charCodeAt(0));
            }
            sendCmd('combo', keys.join(','));
          }
          hiddenCatcher.value = '';
          return;
        }

        // 4. الأسهم المنفردة
        let arrowCodeOnly = getArrowCode(e.code);
        if (arrowCodeOnly > 0) {
          sendCmd('key', arrowCodeOnly.toString());
          hiddenCatcher.value = '';
          return;
        }

        // 5. كتابة رقم الصفر 0 وباقي الحروف
        if (e.key === '0' || e.code === 'Digit0' || e.code === 'Numpad0') {
          sendCmd('key', '48');
        } else if (e.key.length === 1) {
          sendCmd('text', e.key);
        } else {
          let code = getHIDCode(e.code, e.key);
          if (code > 0) sendCmd('key', code.toString());
        }
        hiddenCatcher.value = '';
      }
    }, true);

    function getArrowCode(code) {
      switch(code) {
        case 'ArrowUp': return 218; 
        case 'ArrowDown': return 217;
        case 'ArrowLeft': return 216; 
        case 'ArrowRight': return 215;
        default: return 0;
      }
    }

    function getHIDCode(code, key) {
      switch(code) {
        case 'Enter': return 176;
        case 'Escape': return 177;
        case 'Backspace': return 178;
        case 'Tab': return 179;
        case 'Delete': return 212;
        case 'Digit0': return 48; 
        case 'Numpad0': return 234; 
        case 'F1': return 194; case 'F2': return 195; case 'F3': return 196;
        case 'F4': return 197; case 'F5': return 198; case 'F12': return 205;
        default: 
          if (key === '0') return 48;
          return 0;
      }
    }
  </script>
</body>
</html>
