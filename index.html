<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>Full-Mapped Queue KVM Pro</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 8px; background-color: #121212; color: white; display: flex; flex-direction: column; min-height: 100vh; overflow: hidden; }
    
    #lockScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #121212; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    .login-card { background: #1e1e1e; padding: 30px; border-radius: 12px; border: 1px solid #333; width: 100%; max-width: 350px; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    .login-card h2 { color: #00d2ff; margin-bottom: 20px; font-size: 24px; }
    #passInput { font-size: 18px; text-align: center; padding: 12px; width: 100%; border-radius: 6px; border: 2px solid #444; background: #2a2a2a; color: white; margin-bottom: 15px; outline: none; transition: 0.2s; }
    #passInput:focus { border-color: #00d2ff; }
    #loginBtn { padding: 12px; width: 100%; font-size: 16px; font-weight: bold; background: #0078d4; border: none; border-radius: 6px; color: white; cursor: pointer; transition: 0.2s; }
    #loginBtn:active { background: #005a9e; }
    #loginError { color: #ff4757; margin-top: 12px; font-size: 14px; font-weight: bold; display: none; }
    
    #topBar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; padding: 0 5px; }
    .status-group { display: flex; align-items: center; gap: 6px; }
    #netStatus { font-size: 12px; font-weight: bold; background: #222; padding: 4px 8px; border-radius: 4px; border: 1px solid #444; }
    #refreshBtn { font-size: 12px; font-weight: bold; background: #333; color: #00d2ff; padding: 4px 8px; border-radius: 4px; border: 1px solid #00d2ff; cursor: pointer; }
    
    #trackpad { height: 160px; min-height: 160px; background-color: #2a2a2a; border-radius: 10px; margin-bottom: 8px; touch-action: none; border: 2px solid #00d2ff; display: flex; align-items: center; justify-content: center; color: #555; font-size: 14px; outline: none; cursor: crosshair;}
    
    .row { display: flex; gap: 6px; margin-bottom: 8px; width: 100%; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 100%; margin-bottom: 8px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; width: 100%; margin-bottom: 8px; }
    
    .btn { padding: 12px 5px; font-size: 14px; font-weight: bold; cursor: pointer; border: none; border-radius: 6px; background-color: #333; color: white; transition: 0.05s; display: flex; align-items: center; justify-content: center; }
    .btn:active, .btn.clicked { background-color: #666; transform: scale(0.96); }
    
    .btn-left { border-bottom: 3px solid #ff4757; }
    .btn-right { border-bottom: 3px solid #2ed573; }
    .btn-drag { border-bottom: 3px solid #feca57; background-color: #444; }
    .btn-drag.active { background-color: #feca57; color: black; }
    .btn-scroll { background-color: #0096c7; border-bottom: 3px solid #00b4d8; }
    
    .key-btn { padding: 12px 5px; font-size: 13px; background-color: #444; border: none; border-radius: 6px; color: white; font-weight: bold; transition: 0.05s; cursor: pointer; user-select: none; }
    .key-btn:active, .key-btn.clicked { background-color: #00d2ff; color: black; transform: scale(0.95); }
    
    #textInput { flex: 1; height: 60px; min-height: 60px; padding: 10px; font-size: 16px; font-weight: bold; border-radius: 6px; border: 2px solid #00d2ff; outline: none; background-color: #1a1a1a; color: #00d2ff; resize: vertical; transition: 0.2s; }
    #textInput::placeholder { color: #555; }
    
    #appContent { display: none; flex-direction: column; height: 100%; overflow-y: auto; padding-bottom: 20px;}
    #hiddenKeyCatcher { position: absolute; top: -9999px; left: -9999px; opacity: 0; width: 1px; height: 1px; }
  </style>
</head>
<body>

  <div id="lockScreen">
    <div class="login-card">
      <h2>🔐 Secure KVM</h2>
      <input type="password" id="passInput" placeholder="Enter Password" onkeypress="if(event.key === 'Enter') verifyPassword()">
      <button id="loginBtn" onclick="verifyPassword()">Login</button>
      <div id="loginError">❌ Wrong Password! Try Again.</div>
    </div>
  </div>

  <div id="appContent">
    <input type="text" id="hiddenKeyCatcher" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">

    <div id="topBar">
      <div style="font-size: 16px; font-weight: bold; color: #00d2ff;">KVM Pro (Full Mapped)</div>
      <div class="status-group">
        <button id="refreshBtn" onclick="location.reload()">🔄 Refresh</button>
        <div id="netStatus">⏳ Queue Ready</div>
      </div>
    </div>

    <div id="trackpad" tabindex="0">Touch or Click here to Lock Mouse & Keyboard</div>
    
    <div class="grid-3">
      <button class="btn btn-left" onclick="triggerEffect(this); sendCmd('click', 'L')">Left</button>
      <button id="dragBtn" class="btn btn-drag" onclick="toggleDrag()">Drag: OFF</button>
      <button class="btn btn-right" onclick="triggerEffect(this); sendCmd('click', 'R')">Right</button>
    </div>

    <div class="row">
      <button class="btn btn-scroll" style="flex:1;" onclick="triggerEffect(this); sendCmd('scroll', '3')">Scroll ⬆️</button>
      <button class="btn btn-scroll" style="flex:1;" onclick="triggerEffect(this); sendCmd('scroll', '-3')">Scroll ⬇️</button>
    </div>

    <div class="row">
      <textarea id="textInput" placeholder="اكتب هنا.. وسيتم إرسال النص طلقة ورا طلقة بالترتيب وبدون فقدان أي حرف"></textarea>
      <button class="btn btn-send" style="background:#007bff; padding:0 15px; border-radius:6px; font-weight:bold; border:none; color:white;" onclick="triggerEffect(this); sendTextDirect()">Send Text</button>
    </div>

    <div class="row">
      <button class="btn" style="flex:1; background:#0984e3;" onclick="triggerEffect(this); sendCmd('copy', '1')">📋 Copy</button>
      <button class="btn" style="flex:1; background:#00b894;" onclick="triggerEffect(this); sendCmd('paste', '1')">📝 Paste</button>
      <button class="btn" style="flex:1; background:#e17055;" onclick="triggerEffect(this); sendCmd('undo', '1')">↩️ Undo</button>
    </div>

    <div class="grid-4">
      <button class="key-btn mod-btn" onclick="toggleMod(this, 128)">Ctrl</button>
      <button class="key-btn mod-btn" onclick="toggleMod(this, 130)">Alt</button>
      <button class="key-btn mod-btn" onclick="toggleMod(this, 129)">Shift</button>
      <button class="key-btn" style="background:#0078d4" onclick="triggerEffect(this); sendCmd('win', '1')">Win 🪟</button>
    </div>

    <div class="grid-4">
      <button class="key-btn" style="background:#8e44ad" onclick="triggerEffect(this); sendCmd('lang', '1')">Lang 🌐</button>
      <button class="key-btn" style="background:#e1b12c; color:black;" onclick="triggerEffect(this); sendCmd('key', '193')">Caps</button>
      <button class="key-btn" onclick="triggerEffect(this); sendCmd('altf4', '1')">Alt+F4</button>
      <button class="key-btn" style="background:#d63031" onclick="triggerEffect(this); sendCmd('cad', '1')">CAD</button>
    </div>

    <div class="grid-4">
      <button class="key-btn" onclick="triggerEffect(this); sendCmd('key', '177')">ESC</button>
      <button class="key-btn" onclick="triggerEffect(this); sendCmd('key', '212')">DEL</button>
      <button class="key-btn" onclick="triggerEffect(this); sendCmd('key', '178')">B-Space</button>
      <button class="key-btn" style="background:#28a745" onclick="triggerEffect(this); sendCmd('key', '176')">Enter</button>
    </div>

    <div class="row">
      <button class="key-btn key-clr" style="flex: 0.5;" onclick="triggerEffect(this); releaseAll()">CLR All</button>
      <div class="d-pad">
        <button class="key-btn up" onclick="triggerEffect(this); sendCmd('key', '218')">UP</button>
        <button class="key-btn left" onclick="triggerEffect(this); sendCmd('key', '216')">LT</button>
        <button class="key-btn down" onclick="triggerEffect(this); sendCmd('key', '217')">DN</button>
        <button class="key-btn right" onclick="triggerEffect(this); sendCmd('key', '215')">RT</button>
      </div>
    </div>
  </div>

  <script>
    const NGROK_BASE = "https://sharply-snarl-buckle.ngrok-free.dev";
    const LOCAL_BASE = "http://192.168.1.7:8080";
    let ACTIVE_URL = NGROK_BASE;
    let userPassword = localStorage.getItem("kvm_password") || "";

    function detectNetwork() {
      const controller = new AbortController();
      setTimeout(() => controller.abort(), 800);
      fetch(LOCAL_BASE + "/ping", { signal: controller.signal })
        .then(res => { if (res.ok) { ACTIVE_URL = LOCAL_BASE; document.getElementById('netStatus').innerHTML = "🟢 Local"; checkSavedLogin(); } })
        .catch(err => { ACTIVE_URL = NGROK_BASE; document.getElementById('netStatus').innerHTML = "🔵 Remote"; checkSavedLogin(); });
    }

    function checkSavedLogin() { if (userPassword !== "") verifyPassword(true); }

    function verifyPassword(isAuto = false) {
      let pwd = isAuto ? userPassword : document.getElementById('passInput').value;
      let errorDiv = document.getElementById('loginError');
      if (pwd === "") return;

      fetch(ACTIVE_URL + "/login", {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
        body: JSON.stringify({ password: pwd })
      })
      .then(res => {
        if (res.status === 200) {
          userPassword = pwd;
          localStorage.setItem("kvm_password", pwd);
          document.getElementById('lockScreen').style.display = "none";
          document.getElementById('appContent').style.display = "flex";
          document.body.style.overflow = "auto";
        } else {
          localStorage.removeItem("kvm_password");
          if(!isAuto) { errorDiv.style.display = "block"; document.getElementById('passInput').value = ""; }
        }
      })
      .catch(err => {
        if(!isAuto) { errorDiv.innerText = "Connection Error!"; errorDiv.style.display = "block"; }
      });
    }

    window.onload = detectNetwork;

    function triggerEffect(el) { el.classList.add('clicked'); setTimeout(() => el.classList.remove('clicked'), 150); }

    // ==========================================
    // 🧠 نظام الطابور الذكي (Request Queue Engine)
    // ==========================================
    let requestQueue = [];
    let isSending = false;

    function sendCmd(type, val) {
      requestQueue.push({ type: type, val: val });
      processQueue();
    }

    function processQueue() {
      if (isSending || requestQueue.length === 0) return;

      isSending = true;
      let currentReq = requestQueue.shift();

      fetch(ACTIVE_URL + "/set_command", {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
        body: JSON.stringify({ type: currentReq.type, val: currentReq.val })
      })
      .then(res => {
        isSending = false;
        processQueue();
      })
      .catch(err => {
        requestQueue.unshift(currentReq);
        isSending = false;
        setTimeout(processQueue, 500);
      });
    }

    let isDragging = false;
    function toggleDrag() {
      isDragging = !isDragging;
      let btn = document.getElementById('dragBtn');
      btn.innerText = isDragging ? "Drag: ON" : "Drag: OFF";
      btn.classList.toggle('active', isDragging);
      sendCmd('drag', isDragging ? "1" : "-1"); 
    }

    function toggleMod(btn, code) {
      btn.classList.toggle('active');
      sendCmd('mod', `${code},${btn.classList.contains('active') ? 1 : 0}`);
    }

    function releaseAll() {
      isDragging = false;
      document.getElementById('dragBtn').innerText = "Drag: OFF";
      document.querySelectorAll('.active').forEach(b => b.classList.remove('active'));
      sendCmd('release', '1');
    }

    function sendTextDirect() {
      let textInput = document.getElementById('textInput');
      let text = textInput.value;
      if(text !== "") { 
        sendCmd('text', text); 
        textInput.value = ''; 
      }
    }

    // ==========================================
    // التحكم والماوس
    // ==========================================
    let trackpad = document.getElementById('trackpad');
    let hiddenCatcher = document.getElementById('hiddenKeyCatcher');
    let moveTimeout = null, accumulatedDx = 0, accumulatedDy = 0;
    let isPointerLocked = false;

    trackpad.addEventListener('touchstart', (e) => {
      lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
    });

    trackpad.addEventListener('touchmove', (e) => {
      accumulatedDx += Math.round((e.touches[0].clientX - lastX) * 1.5);
      accumulatedDy += Math.round((e.touches[0].clientY - lastY) * 1.5);
      lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
      processMouseMovement();
      e.preventDefault();
    }, { passive: false });

    trackpad.addEventListener('click', () => {
      hiddenCatcher.focus();
      trackpad.requestPointerLock = trackpad.requestPointerLock || trackpad.webkitRequestPointerLock;
      if(trackpad.requestPointerLock) trackpad.requestPointerLock();
    });

    hiddenCatcher.addEventListener('blur', () => {
      if (isPointerLocked) hiddenCatcher.focus();
    });

    document.addEventListener('pointerlockchange', () => {
      isPointerLocked = (document.pointerLockElement === trackpad);
      if (isPointerLocked) {
        document.getElementById('netStatus').innerHTML = "🔒 Full Mapped Active";
        document.getElementById('netStatus').style.color = "#00b894";
        hiddenCatcher.focus();
      } else {
        document.getElementById('netStatus').innerHTML = "🟢 Local / Remote";
        document.getElementById('netStatus').style.color = "white";
        hiddenCatcher.blur();
      }
    });

    document.addEventListener('mousemove', (e) => {
      if (isPointerLocked) {
        accumulatedDx += (e.movementX * 2.5);
        accumulatedDy += (e.movementY * 2.5);
        processMouseMovement();
      }
    });

    function processMouseMovement() {
      if (!moveTimeout) {
        moveTimeout = setTimeout(() => {
          let sendX = Math.round(accumulatedDx);
          let sendY = Math.round(accumulatedDy);
          if (sendX > 100) sendX = 100; if (sendX < -100) sendX = -100;
          if (sendY > 100) sendY = 100; if (sendY < -100) sendY = -100;
          if (sendX !== 0 || sendY !== 0) { 
            sendCmd('move', `${sendX},${sendY}`); 
            accumulatedDx -= sendX; 
            accumulatedDy -= sendY; 
          } else { 
            accumulatedDx = 0; 
            accumulatedDy = 0; 
          }
          moveTimeout = null;
        }, 15); 
      }
    }

    document.addEventListener('mousedown', (e) => {
      if (isPointerLocked) {
        if (e.button === 0) sendCmd('drag', '1');
        else if (e.button === 2) sendCmd('click', 'R');
      }
    });

    document.addEventListener('mouseup', (e) => {
      if (isPointerLocked && e.button === 0) {
        sendCmd('drag', '-1');
      }
    });

    document.addEventListener('wheel', (e) => {
      if (isPointerLocked) {
        if (e.deltaY > 0) sendCmd('scroll', '-3');
        else sendCmd('scroll', '3');
      }
    }, { passive: true });

    document.addEventListener('contextmenu', (e) => {
      if (isPointerLocked) e.preventDefault(); 
    });

    // ==========================================
    // ⌨️ المابنج الشامل لكل أزرار الكيبورد والـ Modifiers عبر الطابور
    // ==========================================
    hiddenCatcher.addEventListener('keydown', (e) => {
      if (isPointerLocked) {
        e.preventDefault(); 
        
        if (e.key === "Escape") {
          document.exitPointerLock(); 
          sendCmd('key', '177');
          return;
        }

        // جدول مابنج كامل لأزرار الكيبورد الفيزيائي (أكواد USB HID الرسمية للأردوينو)
        let hidCode = getFullHIDKeyCode(e);

        if (hidCode > 0) {
          sendCmd('key', hidCode.toString());
        } else if (e.key.length === 1) {
          sendCmd('text', e.key); // الحروف العادية تتدخل الطابور
        }
        
        hiddenCatcher.value = '';
      }
    });

    function getFullHIDKeyCode(e) {
      // التحقق من أزرار التحكم الخاصة (Modifiers & Special Keys)
      switch(e.code) {
        case 'ControlLeft': case 'ControlRight': return 128; // Ctrl
        case 'ShiftLeft': case 'ShiftRight': return 129;     // Shift
        case 'AltLeft': case 'AltRight': return 130;         // Alt
        case 'MetaLeft': case 'MetaRight': return 131;       // Windows Key
        case 'Enter': return 176;
        case 'Escape': return 177;
        case 'Backspace': return 178;
        case 'Tab': return 179;
        case 'Delete': return 212;
        case 'Insert': return 209;
        case 'Home': return 210;
        case 'End': return 213;
        case 'PageUp': return 211;
        case 'PageDown': return 214;
        case 'ArrowUp': return 218;
        case 'ArrowDown': return 217;
        case 'ArrowLeft': return 216;
        case 'ArrowRight': return 215;
        case 'CapsLock': return 193;
        case 'F1': return 194; case 'F2': return 195; case 'F3': return 196;
        case 'F4': return 197; case 'F5': return 198; case 'F6': return 199;
        case 'F7': return 200; case 'F8': return 201; case 'F9': return 202;
        case 'F10': return 203; case 'F11': return 204; case 'F12': return 205;
        default: return 0;
      }
    }
  </script>
</body>
</html>
